<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRG Payment Integrity Dashboard</title>
    
    <!-- External CDN Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #f4f7f4;
            --bg-darker: #eaf1ec;
            --bg-card: #ffffff;
            --bg-hover: #f7faf7;
            --text-primary: #15231d;
            --text-secondary: #66756e;
            --accent-color: #1f8a5b;
            --accent-light: #2ea66f;
            --border-color: #dfe7e1;
            --success-color: #1f8a5b;
            --warning-color: #c48319;
            --danger-color: #c84d42;
            --blue-color: #2877b9;
            --shadow: 0 10px 24px rgba(21, 35, 29, 0.08);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* ========== ERROR BANNER ========== */
        .error-banner {
            background-color: var(--danger-color);
            color: white;
            padding: 16px 20px;
            margin: 0;
            display: none;
            position: relative;
            z-index: 1000;
        }

        .error-banner.show {
            display: block;
        }

        .error-banner button {
            background: white;
            color: var(--danger-color);
            border: none;
            padding: 4px 12px;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 10px;
            font-weight: 600;
        }

        /* ========== TOP BAR ========== */
        .top-bar {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .top-bar-left h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .top-bar-left p {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .load-month-badge {
            background-color: var(--accent-color);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        /* ========== FILTER BAR ========== */
        .filter-bar {
            background-color: var(--bg-darker);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 20px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 180px;
        }

        .filter-group label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-secondary);
        }

        .filter-group select {
            background-color: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
        }

        .filter-group select:hover {
            border-color: var(--accent-color);
        }

        .filter-group select:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(31, 138, 91, 0.12);
        }

        .reset-filters-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            align-self: flex-end;
            margin-top: 20px;
        }

        .reset-filters-btn:hover {
            background-color: var(--accent-light);
        }

        /* ========== MAIN CONTENT ========== */
        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
            gap: 0;
        }

        .left-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            border-right: 1px solid var(--border-color);
            padding: 16px;
            gap: 16px;
        }

        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-left: 1px solid var(--border-color);
        }

        @media (max-width: 1200px) {
            .main-content {
                flex-direction: column;
            }
            .left-panel {
                border-right: none;
                border-bottom: 1px solid var(--border-color);
                max-height: 50%;
            }
            .right-panel {
                border-left: none;
            }
        }

        /* ========== KPI CARDS ========== */
        .kpi-cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
        }

        .kpi-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            transition: all 0.2s ease;
        }

        .kpi-card:hover {
            border-color: var(--accent-color);
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        .kpi-card-label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .kpi-card-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--accent-color);
            word-break: break-word;
        }

        /* ========== CHARTS CONTAINER ========== */
        .charts-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 16px;
            flex: 1;
            overflow-y: auto;
        }

        .chart-wrapper {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            min-height: 300px;
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }

        .chart-wrapper h3 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-primary);
        }

        .chart-canvas-wrapper {
            flex: 1;
            position: relative;
            min-height: 250px;
        }

        /* ========== TABS ========== */
        .tabs-container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .tab-nav {
            display: flex;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--bg-card);
            gap: 0;
        }

        .tab-button {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-secondary);
            padding: 12px 0;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s ease;
            text-transform: uppercase;
            position: relative;
        }

        .tab-button:hover {
            color: var(--text-primary);
        }

        .tab-button.active {
            color: var(--accent-color);
        }

        .tab-button.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background-color: var(--accent-color);
        }

        .tab-content {
            display: none;
            flex: 1;
            overflow: hidden;
            flex-direction: column;
        }

        .tab-content.active {
            display: flex;
        }

        /* ========== SUMMARY TAB ========== */
        .summary-content {
            overflow-y: auto;
            padding: 20px;
            gap: 20px;
        }

        .summary-content > .kpi-cards-container {
            gap: 12px;
        }

        .summary-charts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 16px;
        }

        /* ========== SELECTION FUNNEL TAB ========== */
        .funnel-content {
            display: flex;
            flex-direction: column;
            gap: 16px;
            height: 100%;
            overflow: auto;
            padding: 20px;
        }

        .funnel-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: end;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 14px;
        }

        .funnel-metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 12px;
        }

        .funnel-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 14px;
        }

        .funnel-card-label {
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .funnel-card-value {
            color: var(--text-primary);
            font-size: 22px;
            font-weight: 750;
        }

        .funnel-chart-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            min-height: 540px;
            padding: 16px;
        }

        .funnel-chart-header {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }

        .funnel-chart-header h3 {
            font-size: 15px;
            font-weight: 700;
        }

        .funnel-note {
            color: var(--text-secondary);
            font-size: 12px;
        }

        .funnel-svg-wrap {
            min-height: 470px;
            overflow: auto;
        }

        .funnel-svg text {
            fill: var(--text-primary);
            font-size: 11px;
            pointer-events: none;
        }

        .funnel-svg .step-label {
            fill: var(--text-secondary);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .funnel-empty {
            color: var(--text-secondary);
            padding: 48px 20px;
            text-align: center;
        }

        /* ========== PIVOT TABLE ========== */
        .pivot-content {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 0;
        }

        .table-toolbar {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 16px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .toolbar-btn {
            background-color: var(--bg-hover);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .toolbar-btn:hover {
            background-color: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        .pivot-table-wrapper {
            flex: 1;
            overflow: auto;
        }

        .pivot-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .pivot-table thead {
            position: sticky;
            top: 0;
            background-color: var(--bg-card);
            z-index: 10;
        }

        .pivot-table th {
            background-color: var(--bg-hover);
            border: 1px solid var(--border-color);
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: var(--text-primary);
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
        }

        .pivot-table th:hover {
            background-color: var(--accent-color);
            color: white;
        }

        .pivot-table td {
            border: 1px solid var(--border-color);
            padding: 10px 12px;
            text-align: left;
            color: var(--text-primary);
        }

        .pivot-table tbody tr:hover {
            background-color: var(--bg-hover);
        }

        .pivot-table tbody tr.expanded {
            border-left: 3px solid var(--accent-color);
        }

        .pivot-table tbody tr.totals-row {
            background-color: var(--bg-hover);
            font-weight: 600;
            border-top: 2px solid var(--accent-color);
        }

        .pivot-table tbody tr.child-row {
            background-color: rgba(31, 138, 91, 0.06);
        }

        .expand-arrow {
            display: inline-block;
            width: 16px;
            height: 16px;
            margin-right: 8px;
            transition: transform 0.2s ease;
            cursor: pointer;
            user-select: none;
        }

        .expand-arrow.expanded {
            transform: rotate(90deg);
        }

        /* ========== FLAT TABLE ========== */
        .claim-detail-content {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 0;
        }

        .flat-table-wrapper {
            flex: 1;
            overflow: auto;
            margin-bottom: 12px;
        }

        .flat-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        .flat-table thead {
            position: sticky;
            top: 0;
            background-color: var(--bg-card);
            z-index: 10;
        }

        .flat-table th {
            background-color: var(--bg-hover);
            border: 1px solid var(--border-color);
            padding: 10px;
            text-align: left;
            font-weight: 600;
            color: var(--text-primary);
            cursor: pointer;
            white-space: nowrap;
        }

        .flat-table th:hover {
            background-color: var(--accent-color);
            color: white;
        }

        .flat-table td {
            border: 1px solid var(--border-color);
            padding: 8px 10px;
            text-align: left;
            color: var(--text-primary);
            word-break: break-word;
            max-width: 300px;
        }

        .flat-table tbody tr:hover {
            background-color: var(--bg-hover);
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 4px;
            padding: 12px 16px;
            background-color: var(--bg-card);
            border-top: 1px solid var(--border-color);
        }

        .pagination button {
            background-color: var(--bg-hover);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .pagination button:hover:not(:disabled) {
            background-color: var(--accent-color);
            color: white;
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pagination span {
            padding: 6px 10px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .column-menu {
            position: absolute;
            right: 16px;
            top: 96px;
            z-index: 50;
            width: min(360px, calc(100vw - 32px));
            max-height: 52vh;
            overflow: auto;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            box-shadow: var(--shadow);
        }

        .column-menu[hidden] {
            display: none;
        }

        .column-menu label {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 4px;
            color: var(--text-primary);
            cursor: pointer;
        }

        /* ========== SCROLLBAR ========== */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-darker);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-color);
        }

        /* ========== PRINT STYLESHEET ========== */
        @media print {
            body {
                background: white;
                color: black;
            }

            .error-banner,
            .filter-bar,
            .table-toolbar,
            .tab-nav,
            .reset-filters-btn,
            .pagination {
                display: none;
            }

            .container {
                height: auto;
            }

            .main-content {
                flex-direction: column;
                border: none;
            }

            .left-panel,
            .right-panel {
                border: none;
                flex: none;
                max-height: none;
                overflow: visible;
                padding: 20px;
            }

            .tab-content {
                display: flex !important;
                page-break-inside: avoid;
            }

            .chart-wrapper,
            .kpi-card,
            .pivot-table {
                background-color: white;
                color: black;
                border: 1px solid #ccc;
                page-break-inside: avoid;
            }

            .kpi-card-value {
                color: #000;
            }

            canvas {
                max-height: 400px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Error Banner -->
        <div class="error-banner" id="errorBanner"></div>

        <!-- Top Bar -->
        <div class="top-bar">
            <div class="top-bar-left">
                <h1 id="dashboardTitle">DRG Payment Integrity Dashboard</h1>
                <p id="dashboardSubtitle">Weekly Review - Operations Lead</p>
            </div>
            <div class="load-month-badge" id="loadMonthBadge">Loading...</div>
        </div>

        <!-- Filter Bar -->
        <div class="filter-bar" id="filterBar"></div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Left Panel: KPIs & Charts -->
            <div class="left-panel">
                <div class="kpi-cards-container" id="kpiContainer"></div>
                <div class="charts-container" id="chartsContainer"></div>
            </div>

            <!-- Right Panel: Tabs -->
            <div class="right-panel">
                <div class="tabs-container">
                    <div class="tab-nav">
                        <button class="tab-button active" data-tab="summary">Summary</button>
                        <button class="tab-button" data-tab="pivot">Pivot View</button>
                        <button class="tab-button" data-tab="selection-funnel">Selection Funnel</button>
                        <button class="tab-button" data-tab="detail">Claim Detail</button>
                    </div>

                    <!-- Summary Tab -->
                    <div class="tab-content active" id="summary-tab">
                        <div class="summary-content">
                            <div class="kpi-cards-container" id="summaryKpiContainer"></div>
                            <div class="summary-charts" id="summarySummaryChartsContainer"></div>
                        </div>
                    </div>

                    <!-- Pivot Tab -->
                    <div class="tab-content" id="pivot-tab">
                        <div class="pivot-content">
                            <div class="table-toolbar">
                                <button class="toolbar-btn" id="exportCsvBtn">Export CSV</button>
                                <button class="toolbar-btn" id="exportPngBtn">Export PNG</button>
                                <button class="toolbar-btn" id="printBtn">Print View</button>
                            </div>
                            <div class="pivot-table-wrapper">
                                <table class="pivot-table" id="pivotTable">
                                    <thead></thead>
                                    <tbody></tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <!-- Selection Funnel Tab -->
                    <div class="tab-content" id="selection-funnel-tab">
                        <div class="funnel-content">
                            <div class="funnel-controls" id="funnelControls"></div>
                            <div class="funnel-metrics" id="funnelMetrics"></div>
                            <div class="funnel-chart-card">
                                <div class="funnel-chart-header">
                                    <h3>Selection Funnel</h3>
                                    <div class="funnel-note">Flow thickness uses claim volume by category.</div>
                                </div>
                                <div class="funnel-svg-wrap" id="funnelSvgWrap"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Claim Detail Tab -->
                    <div class="tab-content" id="detail-tab">
                        <div class="claim-detail-content">
                            <div class="table-toolbar">
                                <button class="toolbar-btn" id="exportDetailCsvBtn">Export CSV</button>
                                <button class="toolbar-btn" id="exportDetailPngBtn">Export PNG</button>
                                <button class="toolbar-btn" id="detailPrintBtn">Print View</button>
                                <button class="toolbar-btn" id="toggleDetailColsBtn">Column Visibility</button>
                                <div class="column-menu" id="detailColumnMenu" hidden></div>
                            </div>
                            <div class="flat-table-wrapper">
                                <table class="flat-table" id="claimDetailTable">
                                    <thead></thead>
                                    <tbody></tbody>
                                </table>
                            </div>
                            <div class="pagination" id="paginationContainer"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ========== DEFAULT CONFIG (EMBEDDED) ==========
        const DEFAULT_CONFIG = {
            "title": "DRG Payment Integrity Dashboard",
            "subtitle": "Weekly Review - Operations Lead",
            "dataFile": "data1.csv",
            "columnMeta": {
                "providertaxid": {"label": "Provider Tax ID", "type": "id", "format": "text", "hidden": false},
                "claimnumber": {"label": "Claim Number", "type": "id", "format": "text", "hidden": false},
                "firstdateofservice": {"label": "First Date of Service", "type": "date", "format": "date", "hidden": false},
                "lastdateofservice": {"label": "Last Date of Service", "type": "date", "format": "date", "hidden": false},
                "dischargestatuscode": {"label": "Discharge Status Code", "type": "dimension", "format": "text", "hidden": false},
                "admitdiagnosiscode": {"label": "Admit Diagnosis Code", "type": "dimension", "format": "text", "hidden": false},
                "primarydiagnosiscode": {"label": "Primary Diagnosis Code", "type": "dimension", "format": "text", "hidden": false},
                "primaryprocedurecode": {"label": "Primary Procedure Code", "type": "dimension", "format": "text", "hidden": false},
                "totalpaidamount": {"label": "Total Paid Amount", "type": "metric", "format": "currency", "hidden": false},
                "lengthofstay": {"label": "Length of Stay", "type": "metric", "format": "number", "hidden": false},
                "loadmonth": {"label": "Load Month", "type": "date", "format": "text", "hidden": false},
                "category": {"label": "Category", "type": "dimension", "format": "text", "hidden": false},
                "selectionreason": {"label": "Selection Reason", "type": "dimension", "format": "text", "hidden": false},
                "subprogramtype": {"label": "Sub-Program Type", "type": "dimension", "format": "text", "hidden": false},
                "exl_nofinding": {"label": "Exclusion No Finding", "type": "metric", "format": "number", "hidden": false},
                "exl_finding": {"label": "Exclusion Finding", "type": "metric", "format": "number", "hidden": false},
                "drgconditiontype": {"label": "DRG Condition Type", "type": "dimension", "format": "text", "hidden": false},
                "mdcn": {"label": "MDC Number", "type": "dimension", "format": "text", "hidden": false},
                "mcc_count": {"label": "MCC Count", "type": "metric", "format": "number", "hidden": false},
                "cc_count": {"label": "CC Count", "type": "metric", "format": "number", "hidden": false},
                "selection_month": {"label": "Selection Month", "type": "date", "format": "text", "hidden": false}
            },
            "filterColumns": ["loadmonth", "category", "subprogramtype", "selectionreason", "drgconditiontype"],
            "kpis": [
                {"label": "Total Claims", "column": "claimnumber", "aggregation": "count", "format": "number"},
                {"label": "Total Paid Amount", "column": "totalpaidamount", "aggregation": "sum", "format": "currency", "prefix": "$"},
                {"label": "Avg Paid Amount", "column": "totalpaidamount", "aggregation": "avg", "format": "currency", "prefix": "$"},

            ],

                {"id": "chart1", "type": "bar", "title": "Claims by Category", "xAxis": "category", "yAxis": "claimnumber", "aggregation": "count"},
                {"id": "chart2", "type": "bar", "title": "Paid Amount by Sub-Program", "xAxis": "subprogramtype", "yAxis": "totalpaidamount", "aggregation": "sum"},
                {"id": "chart3", "type": "doughnut", "title": "Selection Reason Mix", "xAxis": "selectionreason", "yAxis": "claimnumber", "aggregation": "count"},
                {"id": "chart4", "type": "horizontalBar", "title": "Top Providers by Paid Amount", "xAxis": "providertaxid", "yAxis": "totalpaidamount", "aggregation": "sum", "topN": 10}
            ],

            "tableMetrics": [
                {"column": "claimnumber", "aggregation": "count", "label": "Claims", "format": "number"},
                {"column": "totalpaidamount", "aggregation": "sum", "label": "Total Paid", "format": "currency"},
                {"column": "totalpaidamount", "aggregation": "avg", "label": "Avg Paid", "format": "currency"},

                {"column": "exl_finding", "aggregation": "sum", "label": "Findings", "format": "number"},
                {"column": "exl_nofinding", "aggregation": "sum", "label": "No Findings", "format": "number"}
            ]
        };

        // ========== STATE MANAGEMENT ==========
        const state = {
            config: null,
            rawData: [],
            filteredData: [],
            filters: {},
            funnelData: [],
            funnelFilters: {
                month: '',
                Program: '',
                Category: ''
            },
            charts: {},

            sortColumn: null,

        // ========== UTILITY FUNCTIONS ==========
        
        function showError(message) {
            const banner = document.getElementById('errorBanner');
            banner.textContent = message;
            banner.innerHTML += ' <button onclick="this.parentElement.classList.remove(\'show\')">Dismiss</button>';
            banner.classList.add('show');
        }

        function formatValue(value, format, column = '') {
            if (value === null || value === undefined || value === '') return '-';
            
            if (format === 'currency') {
                return new Intl.NumberFormat('en-US', {
                    style: 'currency',
                    currency: 'USD',
                    minimumFractionDigits: 0,
                    maximumFractionDigits: 0
                }).format(value);
            } else if (format === 'percent') {
                return new Intl.NumberFormat('en-US', {
                    style: 'percent',
                    minimumFractionDigits: 1,
                    maximumFractionDigits: 1
                }).format(value / 100);
            } else if (format === 'number') {
                return new Intl.NumberFormat('en-US').format(value);
            } else if (format === 'date') {
                try {
                    return new Date(value).toLocaleDateString('en-US');
                } catch {
                    return value;
                }
            }
            return value;
        }

        function aggregate(rows, column, aggregation) {
            if (!rows || rows.length === 0) return 0;
            switch (aggregation) {
                case 'sum':
                    return sumRows(rows, column);
                case 'count':
                    return countRows(rows, column);
                case 'avg':
                    return avgRows(rows, column);
                case 'distinct_count':
                    return distinctCountRows(rows, column);
                default:
                    return 0;
            }
        }

        function sumRows(rows, columnName) {
            return rows.reduce((total, row) => total + numericValue(row[columnName]), 0);
        }

        function countRows(rows, columnName) {
            return rows.filter(row => row[columnName] !== null && row[columnName] !== undefined && String(row[columnName]) !== '').length;
        }

        function avgRows(rows, columnName) {
            const values = rows
                .map(row => row[columnName])
                .filter(value => value !== null && value !== undefined && String(value) !== '')
                .map(numericValue)
                .filter(value => Number.isFinite(value));
            return values.length ? values.reduce((total, value) => total + value, 0) / values.length : 0;
        }

        function distinctCountRows(rows, columnName) {
            return new Set(rows.map(row => String(row[columnName] ?? '')).filter(Boolean)).size;
        }

        function numericValue(value) {
            if (typeof value === 'number') return Number.isFinite(value) ? value : 0;
            const parsed = Number(String(value ?? '').replace(/[$,%\s,]/g, ''));
            return Number.isFinite(parsed) ? parsed : 0;
        }

        function hasDataColumn(column) {
            return !!state.rawData[0] && Object.prototype.hasOwnProperty.call(state.rawData[0], column);
        }

        function filterData() {
            const filterEntries = Object.entries(state.filters).filter(([_, v]) => v !== '');
            
            state.filteredData = state.rawData.filter(row => {
                return filterEntries.every(([col, val]) => {
                    return String(row[col] || '') === String(val);
                });
            });

            updateDashboard();
            renderFilterBar();
        }

        // ========== CONFIG & DATA LOADING ==========
        
        async function loadConfig() {
            console.log('Starting loadConfig...');
            try {
                const response = await fetch('config.json');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                state.config = await response.json();
                console.log('Config loaded from config.json:', state.config);
                initializeDashboard();
            } catch (error) {
                console.error('Failed to load config.json:', error);
                showError(`Could not load config.json. Open this dashboard with load_data.bat so Chrome allows local file access. Details: ${error.message}`);
            }
        }

        async function loadData() {
            try {
                const filePath = state.config.dataFile;
                console.log('Loading data from:', filePath);
                
                let text;
                try {
                    // Try fetch first
                    const response = await fetch(filePath);
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    text = await response.text();
                } catch (fetchError) {
                    // Fallback to XMLHttpRequest for better local file support
                    console.log('Fetch failed, trying XMLHttpRequest:', fetchError.message);
                    text = await new Promise((resolve, reject) => {
                        const xhr = new XMLHttpRequest();
                        xhr.open('GET', filePath, true);
                        xhr.onload = () => {
                            if (xhr.status === 0 || xhr.status === 200) {
                                resolve(xhr.responseText);
                            } else {
                                reject(new Error(`XHR Status ${xhr.status}`));
                            }
                        };
                        xhr.onerror = () => reject(new Error('XHR error loading file'));
                        xhr.send();
                    });
                }
                
                const lowerFilePath = filePath.toLowerCase();
                if (lowerFilePath.endsWith('.csv')) {
                    const result = Papa.parse(text, { header: true, skipEmptyLines: true });
                    if (result.errors && result.errors.length > 0) {
                        console.warn('CSV parse warnings:', result.errors);
                    }
                    state.rawData = result.data.filter(row => Object.keys(row).some(key => row[key]));
                } else if (lowerFilePath.endsWith('.xlsx') || lowerFilePath.endsWith('.xls')) {
                    const arrayBuffer = await new Promise((resolve, reject) => {
                        const xhr = new XMLHttpRequest();
                        xhr.open('GET', filePath, true);
                        xhr.responseType = 'arraybuffer';
                        xhr.onload = () => resolve(xhr.response);
                        xhr.onerror = () => reject(new Error('Failed to load XLSX'));
                        xhr.send();
                    });
                    const workbook = XLSX.read(arrayBuffer, { type: 'array' });
                    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    state.rawData = XLSX.utils.sheet_to_json(firstSheet);
                } else {
                    throw new Error('Unsupported file format. Use .csv or .xlsx');
                }
                
                console.log(`Data loaded successfully: ${state.rawData.length} rows`);
                console.log('First row sample:', state.rawData[0]);
                const detectedColumns = Object.keys(state.rawData[0] || {});
                Object.keys(state.config.columnMeta || {}).forEach(col => {
                    if (!detectedColumns.includes(col)) console.warn(`Configured column missing from data file, skipping where needed: ${col}`);
                });
                
                state.filteredData = [...state.rawData];
                await loadFunnelData();
                renderDashboard();
            } catch (error) {
                console.error('Failed to load data:', error);
                showError(`Failed to load ${state.config.dataFile}: ${error.message}. Make sure the file exists in the same folder as dashboard.html.`);
            }
        }

        async function loadFunnelData() {
            try {
                const response = await fetch('payment_integrity_5000.csv');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const text = await response.text();
                const result = Papa.parse(text, { header: true, skipEmptyLines: true });
                if (result.errors && result.errors.length > 0) {
                    console.warn('Selection funnel CSV parse warnings:', result.errors);
                }
                state.funnelData = result.data.filter(row => Object.keys(row).some(key => row[key]));
            } catch (error) {
                console.warn('Selection funnel data could not be loaded:', error);
                state.funnelData = [];
            }
        }

        function initializeDashboard() {
            try {
                console.log('Initializing dashboard with config:', state.config);
                document.getElementById('dashboardTitle').textContent = state.config.title;
                document.getElementById('dashboardSubtitle').textContent = state.config.subtitle;
                
                // Initialize filters
                state.filters = {};
                state.config.filterColumns.forEach(col => {

        // ========== TOP BAR & FILTER BAR ==========
        
        function renderTopBar() {
            const loadMonths = [...new Set(state.rawData.map(r => r.loadmonth))].sort().reverse();
            const currentMonth = loadMonths[0] || '202506';
            document.getElementById('loadMonthBadge').textContent = `Load Month: ${currentMonth}`;
        }

        function renderFilterBar() {
            const filterBar = document.getElementById('filterBar');
            filterBar.innerHTML = '';
            
            state.config.filterColumns.forEach(col => {
                const colMeta = state.config.columnMeta[col];
                if (!colMeta) {
                    console.warn(`Column ${col} not found in columnMeta, skipping filter`);
                    return;
                }
                
                const rowsForOptions = state.rawData.filter(row => {
                    return Object.entries(state.filters).every(([filterCol, filterVal]) => {
                        return filterCol === col || filterVal === '' || String(row[filterCol] || '') === String(filterVal);
                    });
                });
                const uniqueValues = [...new Set(rowsForOptions.map(r => r[col]))].filter(v => v !== null && v !== undefined && v !== '').sort();
                
                if (uniqueValues.length === 0) {
                    console.warn(`No unique values found for filter column: ${col}`);
                    return;
                }
                
                const group = document.createElement('div');
                group.className = 'filter-group';
                
                const label = document.createElement('label');
                label.textContent = colMeta.label;
                
                const select = document.createElement('select');
                select.name = col;
                
                const emptyOpt = document.createElement('option');
                emptyOpt.value = '';
                emptyOpt.textContent = `All ${colMeta.label}`;
                select.appendChild(emptyOpt);
                
                uniqueValues.forEach(val => {
                    const opt = document.createElement('option');
                    opt.value = val;
                    opt.textContent = val;
                    select.appendChild(opt);
                });
                
                select.addEventListener('change', (e) => {
                    state.filters[col] = e.target.value;
                    filterData();
                });
                select.value = state.filters[col] || '';
                
                group.appendChild(label);
                group.appendChild(select);
                filterBar.appendChild(group);
            });
            
            const resetBtn = document.createElement('button');
            resetBtn.className = 'reset-filters-btn';
            resetBtn.textContent = 'Reset Filters';
            resetBtn.addEventListener('click', () => {
                state.config.filterColumns.forEach(col => {
                    state.filters[col] = '';
                    const select = filterBar.querySelector(`select[name="${col}"]`);
                    if (select) select.value = '';
                });
                filterData();
            });
            filterBar.appendChild(resetBtn);
        }

        // ========== KPI CARDS ==========
        
        function renderKpiCards() {
            const container = document.getElementById('kpiContainer');
            const summaryContainer = document.getElementById('summaryKpiContainer');
            container.innerHTML = '';
            summaryContainer.innerHTML = '';
            
            const html = state.config.kpis.filter(kpi => hasDataColumn(kpi.column)).map(kpi => {
                try {
                    const value = aggregate(state.filteredData, kpi.column, kpi.aggregation);
                    const formatted = formatValue(value, kpi.format);
                    const formatted_with_prefix = (kpi.prefix || '') + formatted + (kpi.suffix || '');
                    
                    return `
                        <div class="kpi-card">
                            <div class="kpi-card-label">${kpi.label}</div>
                            <div class="kpi-card-value">${formatted_with_prefix}</div>
                        </div>
                    `;
                } catch (error) {
                    console.error(`Error rendering KPI ${kpi.label}:`, error);
                    return '';
                }
            }).join('');
            
            container.innerHTML = html;
