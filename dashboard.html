        // ========== CHARTS ==========
        
        function renderCharts() {
            Object.values(state.charts).forEach(chart => chart?.destroy());
            state.charts = {};
            const container = document.getElementById('chartsContainer');
            const summaryContainer = document.getElementById('summarySummaryChartsContainer');
            container.innerHTML = '';
            summaryContainer.innerHTML = '';
            state.config.charts
                .filter(chartConfig => hasDataColumn(chartConfig.xAxis) && hasDataColumn(chartConfig.yAxis))
                .forEach(chartConfig => {
                    container.appendChild(createChartWrapper(chartConfig, chartConfig.id));
                    summaryContainer.appendChild(createChartWrapper(chartConfig, `summary-${chartConfig.id}`));
                    createChart(chartConfig, chartConfig.id);
                    createChart(chartConfig, `summary-${chartConfig.id}`);
                });
        }

        function createChartWrapper(chartConfig, canvasId) {
            const wrapper = document.createElement('div');
            wrapper.className = 'chart-wrapper';
            wrapper.innerHTML = `
                <h3>${chartConfig.title}</h3>
                <div class="chart-canvas-wrapper">
                    <canvas id="${canvasId}"></canvas>
                </div>
            `;
            return wrapper;
        }

        function createChart(chartConfig, canvasId) {
            const xAxis = chartConfig.xAxis;
            const yAxis = chartConfig.yAxis;
            const aggregation = chartConfig.aggregation;
            const topN = chartConfig.topN || null;
            const grouped = {};
            state.filteredData.forEach(row => {
                const key = row[xAxis] || '(blank)';
                if (!grouped[key]) grouped[key] = [];
                grouped[key].push(row);
            });
            let chartRows = Object.keys(grouped).map(label => ({ label, value: aggregate(grouped[label], yAxis, aggregation) }));
            chartRows.sort((a, b) => b.value - a.value || String(a.label).localeCompare(String(b.label), 'en-US', { numeric: true }));
            if (topN) chartRows = chartRows.slice(0, topN);
            const chartLabels = chartRows.map(row => row.label);
            const chartValues = chartRows.map(row => row.value);
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            const colors = chartConfig.colorPalette || ['#1f8a5b', '#2877b9', '#c48319', '#c84d42', '#7f8b86', '#2ea66f', '#8a6f2a', '#5b7f95'];
            const chartType = chartConfig.type === 'horizontalBar' ? 'bar' : chartConfig.type;
            state.charts[canvasId] = new Chart(canvas.getContext('2d'), {
                type: chartType,
                data: {
                    labels: chartLabels,
                    datasets: [{
                        label: chartConfig.title,
                        data: chartValues,
                        backgroundColor: chartLabels.map((_, i) => colors[i % colors.length]),
                        borderColor: '#ffffff',
                        borderWidth: 1
                    }]
                },
                options: {
                    indexAxis: chartConfig.type === 'horizontalBar' ? 'y' : 'x',
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: chartType === 'doughnut', labels: { color: '#15231d' } } },
                    scales: chartType === 'doughnut' ? {} : {
                        x: { ticks: { color: '#66756e' }, grid: { color: '#dfe7e1' } },
                        y: { ticks: { color: '#66756e' }, grid: { color: '#dfe7e1' } }
                    },
                    onClick: (event, elements) => {
                        if (!elements.length) return;
                        const label = chartLabels[elements[0].index];
                        state.filters[xAxis] = label === '(blank)' ? '' : label;
                        const select = document.querySelector(`select[name="${xAxis}"]`);
                        if (select) select.value = state.filters[xAxis];
                        filterData();
                    }
                }
            });
        }

        // ========== SELECTION FUNNEL ==========

        const FUNNEL_STEPS = ['Inflow', 'Inscope', 'Initial Selection', 'Final Selection', 'Approval', 'Audit', 'Finding'];
        const FUNNEL_COLORS = ['#1f8a5b', '#2877b9', '#c48319', '#c84d42', '#7f8b86', '#2ea66f', '#8a6f2a', '#5b7f95'];

        function renderSelectionFunnel() {
            renderFunnelControls();
            renderFunnelMetricsAndChart();
        }

        function renderFunnelControls() {
            const container = document.getElementById('funnelControls');
            if (!container) return;
            container.innerHTML = '';

            if (!state.funnelData.length) {
                container.innerHTML = '<div class="funnel-empty">payment_integrity_5000.csv was not found or has no rows.</div>';
                return;
            }

            [
                { column: 'month', label: 'Timeframe' },
                { column: 'Program', label: 'Program' },
                { column: 'Category', label: 'Category' }
            ].forEach(filter => {
                const rowsForOptions = state.funnelData.filter(row => {
                    return Object.entries(state.funnelFilters).every(([filterCol, filterVal]) => {
                        return filterCol === filter.column || filterVal === '' || String(row[filterCol] || '') === String(filterVal);
                    });
                });
                const values = [...new Set(rowsForOptions.map(row => row[filter.column]))]
                    .filter(value => value !== null && value !== undefined && value !== '')
                    .sort((a, b) => String(a).localeCompare(String(b), 'en-US', { numeric: true }));

                const group = document.createElement('div');
                group.className = 'filter-group';

                const label = document.createElement('label');
                label.textContent = filter.label;

                const select = document.createElement('select');
                select.name = `funnel-${filter.column}`;

                const emptyOpt = document.createElement('option');
                emptyOpt.value = '';
                emptyOpt.textContent = `All ${filter.label}`;
                select.appendChild(emptyOpt);

                values.forEach(value => {
                    const opt = document.createElement('option');
                    opt.value = value;
                    opt.textContent = value;
                    select.appendChild(opt);
                });

                select.value = state.funnelFilters[filter.column] || '';
                select.addEventListener('change', event => {
                    state.funnelFilters[filter.column] = event.target.value;
                    renderSelectionFunnel();
                });

                group.appendChild(label);
                group.appendChild(select);
                container.appendChild(group);
            });

            const resetBtn = document.createElement('button');
            resetBtn.className = 'reset-filters-btn';
            resetBtn.textContent = 'Reset Funnel';
            resetBtn.addEventListener('click', () => {
                Object.keys(state.funnelFilters).forEach(key => state.funnelFilters[key] = '');
                renderSelectionFunnel();
            });
            container.appendChild(resetBtn);
        }

        function getFilteredFunnelRows() {
            return state.funnelData.filter(row => {
                return Object.entries(state.funnelFilters).every(([col, val]) => {
                    return val === '' || String(row[col] || '') === String(val);
                });
            });
        }

        function summarizeFunnelRows(rows) {
            if (isLinkFunnelData(rows)) return summarizeFunnelLinks(rows);

            const byCategory = {};
            rows.forEach(row => {
                const category = row.Category || '(blank)';
                if (!byCategory[category]) {
                    byCategory[category] = Object.fromEntries(FUNNEL_STEPS.map(step => [step, 0]));
                }
                FUNNEL_STEPS.forEach(step => {
                    byCategory[category][step] += numericValue(row[step]);
                });
            });
            return byCategory;
        }

        function isLinkFunnelData(rows = state.funnelData) {
            return !!rows[0] && ['from_step', 'from_channel', 'to_step', 'to_channel', 'claim_count'].every(col => {
                return Object.prototype.hasOwnProperty.call(rows[0], col);
            });
        }

        function summarizeFunnelLinks(rows) {
            const links = new Map();
            const nodes = new Map();

            rows.forEach(row => {
                const fromStep = row.from_step || '';
                const toStep = row.to_step || '';
                if (!fromStep || !toStep) return;

                const fromChannel = row.from_channel || fromStep;
                const toChannel = row.to_channel || toStep;
                const category = row.Category || '(blank)';
                const value = numericValue(row.claim_count);
                if (value <= 0) return;

                const sourceKey = `${fromStep}||${fromChannel}`;
                const targetKey = `${toStep}||${toChannel}`;
                const linkKey = `${category}||${sourceKey}||${targetKey}`;

                if (!nodes.has(sourceKey)) nodes.set(sourceKey, { key: sourceKey, step: fromStep, channel: fromChannel, inValue: 0, outValue: 0 });
                if (!nodes.has(targetKey)) nodes.set(targetKey, { key: targetKey, step: toStep, channel: toChannel, inValue: 0, outValue: 0 });

                nodes.get(sourceKey).outValue += value;
                nodes.get(targetKey).inValue += value;

                if (!links.has(linkKey)) {
                    links.set(linkKey, { sourceKey, targetKey, category, value: 0 });
                }
                links.get(linkKey).value += value;
            });

            return {
                nodes: [...nodes.values()].map(node => ({ ...node, value: Math.max(node.inValue, node.outValue) })),
                links: [...links.values()]
            };
        }

        function renderFunnelMetricsAndChart() {
            const rows = getFilteredFunnelRows();
            const metricsContainer = document.getElementById('funnelMetrics');
            const svgWrap = document.getElementById('funnelSvgWrap');
            if (!metricsContainer || !svgWrap) return;

            if (!rows.length) {
                metricsContainer.innerHTML = '';
                svgWrap.innerHTML = '<div class="funnel-empty">No funnel rows match the selected filters.</div>';
                return;
            }

            const totals = calculateFunnelTotals(rows);
            const hitRate = totals.Audit ? totals.Finding / totals.Audit : 0;
            const overpayment = getOverpaymentIdentified(rows);

            metricsContainer.innerHTML = [
                createFunnelMetricHtml('Inflow', formatValue(totals.Inflow, 'number')),
                createFunnelMetricHtml('Final Selection', formatValue(totals['Final Selection'], 'number')),
                createFunnelMetricHtml('Hit Rate', formatValue(hitRate * 100, 'percent')),
                createFunnelMetricHtml(overpayment.label, formatValue(overpayment.value, 'currency'))
            ].join('');

            renderFunnelSvg(summarizeFunnelRows(rows), svgWrap);
        }

        function calculateFunnelTotals(rows) {
            if (!isLinkFunnelData(rows)) {
                return Object.fromEntries(FUNNEL_STEPS.map(step => [step, sumRows(rows, step)]));
            }

            return Object.fromEntries(FUNNEL_STEPS.map(step => {
                const total = rows.reduce((sum, row) => {
                    if (step === 'Inflow' && row.from_step === 'Inflow') return sum + numericValue(row.claim_count);
                    if (step !== 'Inflow' && row.to_step === step) return sum + numericValue(row.claim_count);
                    return sum;
                }, 0);
                return [step, total];
            }));
        }

        function createFunnelMetricHtml(label, value) {
            return `
                <div class="funnel-card">
                    <div class="funnel-card-label">${escapeHtml(label)}</div>
                    <div class="funnel-card-value">${escapeHtml(value)}</div>
                </div>
            `;
        }

        function getOverpaymentIdentified(rows) {
            const possibleColumns = ['overpayment_identified', 'Overpayment Identified', 'overpaymentidentified'];
            const column = possibleColumns.find(col => rows.some(row => row[col] !== undefined && row[col] !== ''));
            if (column) {
                return { label: 'Overpayment Identified', value: sumRows(rows, column) };
            }
            return { label: 'Estimated Overpayment', value: sumRows(rows, 'Finding') * 2500 };
        }

        function renderFunnelSvg(summary, container) {
            if (summary.nodes && summary.links) {
                renderLinkFunnelSvg(summary, container);
                return;
            }

            const byCategory = summary;
            const categories = Object.keys(byCategory)
                .sort((a, b) => byCategory[b].Inflow - byCategory[a].Inflow || a.localeCompare(b));
            const width = Math.max(container.clientWidth || 920, 920);
            const rowGap = 88;
            const topPad = 74;
            const height = Math.max(470, topPad + categories.length * rowGap + 60);
            const nodeW = 116;
            const nodeH = 34;
            const leftPad = 26;
            const rightPad = 26;
            const xGap = (width - leftPad - rightPad - nodeW) / (FUNNEL_STEPS.length - 1);
            const maxLinkValue = Math.max(...categories.flatMap(category => {
                return FUNNEL_STEPS.slice(1).map(step => byCategory[category][step]);
            }), 1);

            const svgParts = [`<svg class="funnel-svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" role="img" aria-label="Selection funnel sankey diagram">`];

            FUNNEL_STEPS.forEach((step, index) => {
                const x = leftPad + index * xGap;
                svgParts.push(`<text class="step-label" x="${x + nodeW / 2}" y="28" text-anchor="middle">${escapeHtml(step)}</text>`);
            });

            categories.forEach((category, categoryIndex) => {
                const color = FUNNEL_COLORS[categoryIndex % FUNNEL_COLORS.length];
                const y = topPad + categoryIndex * rowGap;

                FUNNEL_STEPS.slice(0, -1).forEach((fromStep, stepIndex) => {
                    const toStep = FUNNEL_STEPS[stepIndex + 1];
                    const value = byCategory[category][toStep];
                    if (value <= 0) return;

                    const x1 = leftPad + stepIndex * xGap + nodeW;
                    const x2 = leftPad + (stepIndex + 1) * xGap;
                    const yMid = y + nodeH / 2;
                    const strokeWidth = Math.max(4, Math.min(30, (value / maxLinkValue) * 30));
                    const path = `M ${x1} ${yMid} C ${x1 + xGap * 0.45} ${yMid}, ${x2 - xGap * 0.45} ${yMid}, ${x2} ${yMid}`;
                    svgParts.push(`
                        <path d="${path}" fill="none" stroke="${color}" stroke-opacity="0.32" stroke-width="${strokeWidth}">
                            <title>${escapeHtml(category)}: ${escapeHtml(fromStep)} to ${escapeHtml(toStep)} - ${formatValue(value, 'number')}</title>
                        </path>
                    `);
                });

                FUNNEL_STEPS.forEach((step, stepIndex) => {
                    const x = leftPad + stepIndex * xGap;
                    const value = byCategory[category][step];
                    svgParts.push(`
                        <g>
                            <rect x="${x}" y="${y}" width="${nodeW}" height="${nodeH}" rx="6" fill="${color}" fill-opacity="0.86">
                                <title>${escapeHtml(step)} / ${escapeHtml(category)}: ${formatValue(value, 'number')}</title>
                            </rect>
                            <text x="${x + 8}" y="${y + 14}" font-weight="700">${escapeHtml(shortenLabel(category, 15))}</text>
                            <text x="${x + 8}" y="${y + 28}">${formatValue(value, 'number')}</text>
                        </g>
                    `);
                });
            });

            svgParts.push('</svg>');
            container.innerHTML = svgParts.join('');
        }

        function renderLinkFunnelSvg(summary, container) {
            if (!summary.links.length || !summary.nodes.length) {
                container.innerHTML = '<div class="funnel-empty">No Sankey links are available for the selected filters.</div>';
                return;
            }

            const width = Math.max(container.clientWidth || 1040, 1040);
            const nodeW = 132;
            const nodeH = 42;
            const leftPad = 26;
            const rightPad = 26;
            const topPad = 72;
            const stepGap = (width - leftPad - rightPad - nodeW) / (FUNNEL_STEPS.length - 1);
            const nodesByStep = {};

            FUNNEL_STEPS.forEach(step => nodesByStep[step] = []);
            summary.nodes.forEach(node => {
                if (!nodesByStep[node.step]) nodesByStep[node.step] = [];
                nodesByStep[node.step].push(node);
            });

            Object.values(nodesByStep).forEach(nodes => {
                nodes.sort((a, b) => b.value - a.value || a.channel.localeCompare(b.channel));
            });

            const maxNodesInStep = Math.max(...Object.values(nodesByStep).map(nodes => nodes.length), 1);
            const rowGap = 24;
            const height = Math.max(520, topPad + maxNodesInStep * (nodeH + rowGap) + 54);
            const maxLinkValue = Math.max(...summary.links.map(link => link.value), 1);
            const nodePositions = new Map();

            FUNNEL_STEPS.forEach((step, stepIndex) => {
                const nodes = nodesByStep[step] || [];
                const totalColumnHeight = nodes.length * nodeH + Math.max(0, nodes.length - 1) * rowGap;
                const startY = topPad + Math.max(0, (height - topPad - totalColumnHeight - 34) / 2);
                nodes.forEach((node, nodeIndex) => {
                    nodePositions.set(node.key, {
                        x: leftPad + stepIndex * stepGap,
                        y: startY + nodeIndex * (nodeH + rowGap)
                    });
                });
            });

            const colorByCategory = {};
            [...new Set(summary.links.map(link => link.category))]
                .sort()
                .forEach((category, index) => {
                    colorByCategory[category] = FUNNEL_COLORS[index % FUNNEL_COLORS.length];
                });

            const svgParts = [`<svg class="funnel-svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" role="img" aria-label="Selection funnel sankey diagram with crossflows">`];

            FUNNEL_STEPS.forEach((step, index) => {
                const x = leftPad + index * stepGap;
                svgParts.push(`<text class="step-label" x="${x + nodeW / 2}" y="28" text-anchor="middle">${escapeHtml(step)}</text>`);
            });

            summary.links
                .sort((a, b) => b.value - a.value)
                .forEach(link => {
                    const source = nodePositions.get(link.sourceKey);
                    const target = nodePositions.get(link.targetKey);
                    if (!source || !target) return;

                    const x1 = source.x + nodeW;
                    const x2 = target.x;
                    const y1 = source.y + nodeH / 2;
                    const y2 = target.y + nodeH / 2;
                    const strokeWidth = Math.max(3, Math.min(28, (link.value / maxLinkValue) * 28));
                    const path = `M ${x1} ${y1} C ${x1 + stepGap * 0.42} ${y1}, ${x2 - stepGap * 0.42} ${y2}, ${x2} ${y2}`;
                    svgParts.push(`
                        <path d="${path}" fill="none" stroke="${colorByCategory[link.category]}" stroke-opacity="0.38" stroke-width="${strokeWidth}">
                            <title>${escapeHtml(link.category)}: ${escapeHtml(labelFromNodeKey(link.sourceKey))} to ${escapeHtml(labelFromNodeKey(link.targetKey))} - ${formatValue(link.value, 'number')}</title>
                        </path>
                    `);
                });

            summary.nodes.forEach(node => {
                const pos = nodePositions.get(node.key);
                if (!pos) return;
                svgParts.push(`
                    <g>
                        <rect x="${pos.x}" y="${pos.y}" width="${nodeW}" height="${nodeH}" rx="6" fill="#ffffff" stroke="#dfe7e1" stroke-width="1">
                            <title>${escapeHtml(node.step)} / ${escapeHtml(node.channel)}: ${formatValue(node.value, 'number')}</title>
                        </rect>
                        <rect x="${pos.x}" y="${pos.y}" width="5" height="${nodeH}" rx="3" fill="${FUNNEL_COLORS[FUNNEL_STEPS.indexOf(node.step) % FUNNEL_COLORS.length]}"></rect>
                        <text x="${pos.x + 12}" y="${pos.y + 17}" font-weight="700" fill="#15231d">${escapeHtml(shortenLabel(node.channel, 17))}</text>
                        <text x="${pos.x + 12}" y="${pos.y + 33}" fill="#66756e">${formatValue(node.value, 'number')}</text>
                    </g>
                `);
            });

            svgParts.push('</svg>');
            container.innerHTML = svgParts.join('');
        }

        function labelFromNodeKey(key) {
            const [step, channel] = String(key).split('||');
            return `${step}: ${channel}`;
        }

        function shortenLabel(value, maxLength) {
            const text = String(value || '');
            return text.length > maxLength ? `${text.slice(0, maxLength - 1)}...` : text;
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, char => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[char]));
        }
        // ========== PIVOT TABLE ==========
        
        function renderPivotTable() {
            const table = document.getElementById('pivotTable');
            const thead = table.querySelector('thead');
            const tbody = table.querySelector('tbody');
            thead.innerHTML = '';
            tbody.innerHTML = '';
            state.expandedRows.clear();
            const levels = state.config.drillDownLevels.filter(hasDataColumn);
            const metrics = state.config.tableMetrics.filter(metric => hasDataColumn(metric.column));
            if (!levels.length) {
                tbody.innerHTML = '<tr><td>No configured drill-down columns were found in this data file.</td></tr>';
                return;
            }
            const headerRow = document.createElement('tr');
            headerRow.innerHTML = `<th>${getColumnLabel(levels[0])}</th>`;
            metrics.forEach((metric, index) => {
                const active = state.sortColumn === metric.column + '|' + metric.aggregation + '|' + index;
                const mark = active ? (state.sortDirection === 'asc' ? ' ^' : ' v') : '';
                headerRow.innerHTML += `<th data-sort-index="${index}" style="cursor: pointer; text-align: right;">${metric.label}${mark}</th>`;
            });
            thead.appendChild(headerRow);
            thead.querySelectorAll('th[data-sort-index]').forEach(th => {
                th.addEventListener('click', () => {
                    const index = Number(th.dataset.sortIndex);
                    const metric = metrics[index];
                    const key = metric.column + '|' + metric.aggregation + '|' + index;
                    if (state.sortColumn === key) state.sortDirection = state.sortDirection === 'asc' ? 'desc' : 'asc';
                    else { state.sortColumn = key; state.sortDirection = 'desc'; }
                    renderPivotTable();
                });
            });
            const rootItems = sortDrillItems(buildDrillDownLevel(state.filteredData, 0), metrics);
            rootItems.forEach((item, idx) => {
                tbody.insertAdjacentHTML('beforeend', drillRowHtml(item, 0, `root-${idx}`, '', metrics, levels));
            });
            tbody.insertAdjacentHTML('beforeend', totalsRowHtml(state.filteredData, 0, metrics));
            tbody.querySelectorAll('.expand-arrow').forEach(bindExpandArrow);
        }

        function buildDrillDownLevel(data, levelIndex) {
            const levels = state.config.drillDownLevels.filter(hasDataColumn);
            if (levelIndex >= levels.length) return [];
            const columnName = levels[levelIndex];
            const grouped = new Map();
            data.forEach(row => {
                const key = String(row[columnName] ?? '') || '(blank)';
                if (!grouped.has(key)) grouped.set(key, []);
                grouped.get(key).push(row);
            });
            return Array.from(grouped.entries()).map(([key, rows]) => ({
                label: key,
                rows,
                level: levelIndex,
                column: columnName
            }));
        }

        function sortDrillItems(items, metrics) {
            if (!state.sortColumn) return items.sort((a, b) => String(a.label).localeCompare(String(b.label), 'en-US', { numeric: true }));
            const parts = state.sortColumn.split('|');
            const metric = metrics[Number(parts[2])];
            if (!metric) return items;
            const dir = state.sortDirection === 'asc' ? 1 : -1;
            return items.sort((a, b) => {
                const av = aggregate(a.rows, metric.column, metric.aggregation);
                const bv = aggregate(b.rows, metric.column, metric.aggregation);
                return dir * (av - bv) || String(a.label).localeCompare(String(b.label), 'en-US', { numeric: true });
            });
        }

        function drillRowHtml(item, level, rowId, parentId, metrics, levels) {
            const hasChildren = level < levels.length - 1;
            const indent = 12 + level * 24;
            let html = `<tr class="pivot-row ${level ? 'child-row' : ''}" data-row-id="${escapeAttr(rowId)}" data-parent-row-id="${escapeAttr(parentId)}" data-level="${level}" data-label="${escapeAttr(item.label)}">`;
            html += `<td style="padding-left: ${indent}px;">`;
            if (hasChildren) html += `<span class="expand-arrow" data-row-id="${escapeAttr(rowId)}">&#9654;</span>`;
            else html += '<span style="display:inline-block;width:24px;"></span>';
            html += `${escapeHtml(getColumnLabel(item.column))}: ${escapeHtml(item.label)}</td>`;
            metrics.forEach(metric => {
                const value = aggregate(item.rows, metric.column, metric.aggregation);
                html += `<td data-sort-value="${value}" style="text-align: right;">${escapeHtml(formatValue(value, metric.format))}</td>`;
            });
            html += '</tr>';
            return html;
        }

        function totalsRowHtml(rows, level, metrics) {
            let html = `<tr class="totals-row child-row" data-parent-row-id="" data-level="${level}"><td style="padding-left: ${12 + level * 24}px;">Total</td>`;
            metrics.forEach(metric => {
                const value = aggregate(rows, metric.column, metric.aggregation);
                html += `<td style="text-align: right;">${escapeHtml(formatValue(value, metric.format))}</td>`;
            });
            html += '</tr>';
            return html;
        }

        function bindExpandArrow(arrow) {
            if (arrow.dataset.bound) return;
            arrow.dataset.bound = '1';
            arrow.addEventListener('click', (e) => {
                e.stopPropagation();
                const row = arrow.closest('tr');
                const rowId = row.dataset.rowId;
                if (state.expandedRows.has(rowId)) {
                    state.expandedRows.delete(rowId);
                    row.classList.remove('expanded');
                    arrow.classList.remove('expanded');
                    removeDescendantRows(row);
                    return;
                }
                state.expandedRows.add(rowId);
                row.classList.add('expanded');
                arrow.classList.add('expanded');
                const parentLevel = Number(row.dataset.level);
                const childLevel = parentLevel + 1;
                const rows = rowsForDrillPath(row);
                const levels = state.config.drillDownLevels.filter(hasDataColumn);
                const metrics = state.config.tableMetrics.filter(metric => hasDataColumn(metric.column));
                const childItems = sortDrillItems(buildDrillDownLevel(rows, childLevel), metrics);
                const html = childItems.map((item, idx) => drillRowHtml(item, childLevel, `${rowId}-${idx}`, rowId, metrics, levels)).join('') + totalsRowHtml(rows, childLevel, metrics);
                row.insertAdjacentHTML('afterend', html);
                let next = row.nextElementSibling;
                while (next && Number(next.dataset.level) > parentLevel) {
                    const childArrow = next.querySelector('.expand-arrow');
                    if (childArrow) bindExpandArrow(childArrow);
                    next = next.nextElementSibling;
                }
            });
        }

        function removeDescendantRows(row) {
            const level = Number(row.dataset.level);
            let next = row.nextElementSibling;
            while (next && Number(next.dataset.level) > level) {
                const doomed = next;
                next = next.nextElementSibling;
                doomed.remove();
            }
        }

        function rowsForDrillPath(row) {
            const path = [];
            let current = row;
            while (current && current.dataset.rowId) {
                path.unshift({ level: Number(current.dataset.level), label: current.dataset.label });
                const parentId = current.dataset.parentRowId;
                current = parentId ? document.querySelector(`tr[data-row-id="${cssEscape(parentId)}"]`) : null;
            }
            const levels = state.config.drillDownLevels.filter(hasDataColumn);
            return state.filteredData.filter(dataRow => path.every(part => {
                const raw = String(dataRow[levels[part.level]] ?? '') || '(blank)';
                return raw === part.label;
            }));
        }

        function getColumnLabel(column) {
            return state.config.columnMeta[column]?.label || column;
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
        }

        function escapeAttr(value) {
            return escapeHtml(value);
        }

        function cssEscape(value) {
            return String(value).replace(/\\/g, '\\\\').replace(/"/g, '\\"');
        }
        // ========== CLAIM DETAIL TABLE ==========
        
        const ROWS_PER_PAGE = 50;
        
        function renderClaimDetailTable() {
            const table = document.getElementById('claimDetailTable');
            const thead = table.querySelector('thead');
            const tbody = table.querySelector('tbody');
            
            thead.innerHTML = '';
            tbody.innerHTML = '';
            
            // Get visible columns based on columnMeta
            const visibleColumns = Object.entries(state.config.columnMeta)
                .filter(([col, meta]) => hasDataColumn(col) && !meta.hidden && !state.hiddenDetailColumns.has(col))
                .map(([col, _]) => col);
            
            if (visibleColumns.length === 0) {
                thead.innerHTML = '<tr><th>No visible columns</th></tr>';
                return;
            }
            
            // Build header
            const headerRow = document.createElement('tr');
            visibleColumns.forEach(col => {
                const meta = state.config.columnMeta[col];
                const th = document.createElement('th');
                th.textContent = meta.label;
                th.dataset.column = col;
                th.addEventListener('click', () => {
                    if (state.detailSortColumn === col) {
                        state.detailSortDirection = state.detailSortDirection === 'asc' ? 'desc' : 'asc';
                    } else {
                        state.detailSortColumn = col;
                        state.detailSortDirection = 'asc';
                    }
                    renderClaimDetailTable();
                });
                headerRow.appendChild(th);
            });
            thead.appendChild(headerRow);
            
            // Sort data
            let sortedData = [...state.filteredData];
            if (state.detailSortColumn) {
                sortedData.sort((a, b) => {
                    let aVal = a[state.detailSortColumn];
                    let bVal = b[state.detailSortColumn];
                    
                    if (!isNaN(aVal) && !isNaN(bVal)) {
                        aVal = parseFloat(aVal);
                        bVal = parseFloat(bVal);
                    }
                    
                    if (aVal < bVal) return state.detailSortDirection === 'asc' ? -1 : 1;
                    if (aVal > bVal) return state.detailSortDirection === 'asc' ? 1 : -1;
                    return 0;
                });
            }
            
            // Paginate
            const totalPages = Math.ceil(sortedData.length / ROWS_PER_PAGE);
            state.currentPivotPage = Math.min(state.currentPivotPage, totalPages || 1);
            const start = (state.currentPivotPage - 1) * ROWS_PER_PAGE;
            const pageData = sortedData.slice(start, start + ROWS_PER_PAGE);
            
            pageData.forEach(row => {
                const tr = document.createElement('tr');
                visibleColumns.forEach(col => {
                    const td = document.createElement('td');
                    const meta = state.config.columnMeta[col];
                    td.textContent = formatValue(row[col], meta.format);
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
            
            renderPagination(totalPages);
        }

        function renderPagination(totalPages) {
            const container = document.getElementById('paginationContainer');
            container.innerHTML = '';
            
            if (totalPages <= 1) return;
            
            const prevBtn = document.createElement('button');
            prevBtn.textContent = 'Previous';
            prevBtn.disabled = state.currentPivotPage === 1;
            prevBtn.addEventListener('click', () => {
                state.currentPivotPage--;
                renderClaimDetailTable();
            });
            container.appendChild(prevBtn);
            
            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= state.currentPivotPage - 1 && i <= state.currentPivotPage + 1)) {
                    if (i > 1 && (i === 2 || state.currentPivotPage - 1 > i)) {
                        const dots = document.createElement('span');
                        dots.textContent = '...';
                        if (container.lastChild?.textContent !== '...') container.appendChild(dots);
                    }
                    
                    const btn = document.createElement('button');
                    btn.textContent = i;
                    btn.style.fontWeight = i === state.currentPivotPage ? 'bold' : 'normal';
                    btn.style.backgroundColor = i === state.currentPivotPage ? 'var(--accent-color)' : '';
                    btn.style.color = i === state.currentPivotPage ? 'white' : '';
                    btn.addEventListener('click', () => {
                        state.currentPivotPage = i;
                        renderClaimDetailTable();
                    });
                    container.appendChild(btn);
                }
            }
            
            const nextBtn = document.createElement('button');
            nextBtn.textContent = 'Next';
            nextBtn.disabled = state.currentPivotPage === totalPages;
            nextBtn.addEventListener('click', () => {
                state.currentPivotPage++;
                renderClaimDetailTable();
            });
            container.appendChild(nextBtn);
            
            const info = document.createElement('span');
            info.textContent = `Page ${state.currentPivotPage} of ${totalPages}`;
            info.style.marginLeft = '20px';
            container.appendChild(info);
        }

        // ========== TAB NAVIGATION ==========
        
        function setupTabNavigation() {
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
                    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                    
                    btn.classList.add('active');
                    const tabId = btn.dataset.tab + '-tab';
                    document.getElementById(tabId).classList.add('active');
                    
                    // Trigger chart resize when switching to tab
                    if (btn.dataset.tab === 'summary') {
                        setTimeout(() => {
                            Object.values(state.charts).forEach(chart => chart?.resize());
                        }, 100);
                    } else if (btn.dataset.tab === 'selection-funnel') {
                        setTimeout(renderSelectionFunnel, 100);
                    }
                });
            });
        }

        // ========== TOOLBAR BUTTONS ==========
        
        function setupToolbarButtons() {
            document.getElementById('exportCsvBtn')?.addEventListener('click', exportPivotCsv);
            document.getElementById('exportDetailCsvBtn')?.addEventListener('click', exportDetailCsv);
            document.getElementById('exportPngBtn')?.addEventListener('click', exportChartsPng);
            document.getElementById('exportDetailPngBtn')?.addEventListener('click', exportChartsPng);
            document.getElementById('printBtn')?.addEventListener('click', () => window.print());
            document.getElementById('detailPrintBtn')?.addEventListener('click', () => window.print());
            document.getElementById('toggleDetailColsBtn')?.addEventListener('click', showDetailColumnVisibilityToggle);
        }

        function exportPivotCsv() {
            exportDetailCsv();
        }

        function exportDetailCsv() {
            const visibleColumns = Object.entries(state.config.columnMeta)
                .filter(([col, meta]) => hasDataColumn(col) && !meta.hidden && !state.hiddenDetailColumns.has(col))
                .map(([col, _]) => col);
            
            let csv = visibleColumns.map(col => {
                const label = state.config.columnMeta[col].label;
                return `"${label.replace(/"/g, '""')}"`;
            }).join(',') + '\n';
            
            state.filteredData.forEach(row => {
                const values = visibleColumns.map(col => {
                    const val = row[col] || '';
                    return `"${String(val).replace(/"/g, '""')}"`;
                });
                csv += values.join(',') + '\n';
            });
            
            downloadCsv(csv, 'claims-export.csv');
        }

        function downloadCsv(csv, filename) {
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }

        function exportChartsPng() {
            const canvases = Array.from(document.querySelectorAll('#chartsContainer canvas'));
            if (!canvases.length) {
                alert('No chart found to export');
                return;
            }
            const exportCanvas = document.createElement('canvas');
            const cellWidth = 620;
            const cellHeight = 360;
            const columns = canvases.length > 1 ? 2 : 1;
            exportCanvas.width = cellWidth * columns;
            exportCanvas.height = cellHeight * Math.ceil(canvases.length / columns);
            const ctx = exportCanvas.getContext('2d');
            ctx.fillStyle = '#f4f7f4';
            ctx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);
            canvases.forEach((canvas, index) => {
                const x = (index % columns) * cellWidth + 20;
                const y = Math.floor(index / columns) * cellHeight + 20;
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(x - 10, y - 10, cellWidth - 20, cellHeight - 20);
                ctx.drawImage(canvas, x, y, cellWidth - 40, cellHeight - 50);
            });
            const link = document.createElement('a');
            link.href = exportCanvas.toDataURL('image/png');
            link.download = 'chart-area-export.png';
            link.click();
        }

        function showColumnVisibilityToggle() {
            showDetailColumnVisibilityToggle();
        }

        function showDetailColumnVisibilityToggle() {
            const menu = document.getElementById('detailColumnMenu');
            if (!menu) return;
            if (!menu.hidden) {
                menu.hidden = true;
                return;
            }
            menu.innerHTML = '';
            Object.entries(state.config.columnMeta)
                .filter(([col, meta]) => hasDataColumn(col) && !meta.hidden)
                .forEach(([col, meta]) => {
                    const label = document.createElement('label');
                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.checked = !state.hiddenDetailColumns.has(col);
                    checkbox.addEventListener('change', () => {
                        if (checkbox.checked) state.hiddenDetailColumns.delete(col);
                        else state.hiddenDetailColumns.add(col);
                        state.currentPivotPage = 1;
                        renderClaimDetailTable();
                    });
                    label.appendChild(checkbox);
                    label.appendChild(document.createTextNode(meta.label || col));
                    menu.appendChild(label);
                });
            menu.hidden = false;
        }
        // ========== INITIALIZATION ==========
        
        document.addEventListener('DOMContentLoaded', loadConfig);
    </script>
</body>
</html>
